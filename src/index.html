<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />

    <title>Five Coffee House</title>

    <base href="/" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="Five Coffee House — cafeteria com cafés, bebidas e produtos selecionados para tornar seus momentos ainda mais especiais."
    />

    <meta
      name="keywords"
      content="Five Coffee House, cafeteria, café, cafés especiais, bebidas, coffee house"
    />

    <meta
      name="author"
      content="Five Coffee House"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Sitemap -->
    <link
      rel="sitemap"
      type="application/xml"
      href="/sitemap.xml"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Five Coffee House"
    />

    <meta
      property="og:description"
      content="Five Coffee House — uma cafeteria criada para proporcionar experiências especiais através do café."
    />

    <meta
      property="og:image"
      content="/assets/img/five_icone.png"
    />

    <meta
      property="og:url"
      content="https://fivecoffeehouse.com.br/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Five Coffee House"
    />

    <meta
      property="og:locale"
      content="pt_BR"
    />

    <meta
      property="og:see_also"
      content="https://www.instagram.com/fivecoffeehouse/"
    />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "Five Coffee House",
        "url": "https://fivecoffeehouse.com.br/",
        "logo": "https://fivecoffeehouse.com.br/assets/img/five_icone.png",
        "description": "Five Coffee House — cafeteria com cafés, bebidas e produtos selecionados.",
        "sameAs": [
          "https://www.instagram.com/fivecoffeehouse/"
        ]
      }
    </script>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/img/five_icone.png"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="tracking-wider">
    <app-root></app-root>
  </body>
</html>
